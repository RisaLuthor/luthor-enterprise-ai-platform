[project]
name = "luthor-ai-systems-framework"
version = "0.1.0"
description = "Modular deterministic AI governance and safety architecture for enterprise LLM deployment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
laf = "laf.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
